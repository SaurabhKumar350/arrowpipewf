<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Configuration - Arrow Pipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-[#EDF1F2] text-gray-800">
    <header
      id="header-container"
      data-include="includes/header.html"
      class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 h-16"
    ></header>

    <div class="flex h-screen pt-16">
      <aside
        id="sidebar"
        class="fixed left-0 top-16 bottom-0 w-72 bg-white border-r border-gray-200 z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 overflow-y-auto"
        data-include="includes/sidebar.html"
      ></aside>

      <div
        id="sidebar-overlay"
        class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden glass"
      ></div>

      <main
        id="main-content"
        class="flex-1 lg:ml-72 p-4 md:p-6 bg-[#F2F2F2] min-h-[calc(100vh-64px)] transition-all duration-300"
      >
        <div class="flex items-center justify-between gap-3 mb-4">
          <div class="flex items-center gap-3">
            <a
              href="settings.html"
              class="inline-flex items-center justify-center h-10 w-10 rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-colors"
              aria-label="Back to Settings"
              title="Back to Settings"
            >
              <i class="ph ph-arrow-left text-xl"></i>
            </a>
            <div>
              <h1 class="text-xl md:text-2xl font-semibold text-gray-900">Lead Configuration</h1>
              <p class="text-sm text-gray-500">Build and save your Lead form layout</p>
            </div>
          </div>
          <!-- <div class="hidden md:flex items-center gap-2">
            <button
              id="lead-config-clear-top"
              type="button"
              class="px-3 py-2 text-sm font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-colors"
            >
              Clear
            </button>
            <button
              id="lead-config-save-top"
              type="button"
              class="px-3 py-2 text-sm font-medium rounded-lg bg-[#E60002] hover:bg-[#E60002]/90 text-white transition-colors"
            >
              Save
            </button>
          </div> -->
        </div>

        <div class="bg-white rounded-[20px] shadow-sm border border-gray-300">
          <form class="p-4 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label for="lead-name" class="block text-sm font-medium text-gray-700 mb-1"
                  >Lead Name <span class="text-[#E60002]">*</span></label
                >
                <input
                  id="lead-name"
                  name="lead_name"
                  type="text"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="lead-mobile" class="block text-sm font-medium text-gray-700 mb-1"
                  >Lead Mobile</label
                >
                <input
                  id="lead-mobile"
                  name="lead_mobile"
                  type="text"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="lead-email" class="block text-sm font-medium text-gray-700 mb-1"
                  >Lead Email</label
                >
                <input
                  id="lead-email"
                  name="lead_email"
                  type="email"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="lead-vertical" class="block text-sm font-medium text-gray-700 mb-1"
                  >Lead Vertical <span class="text-[#E60002]">*</span></label
                >
                <select
                  id="lead-vertical"
                  name="lead_vertical"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                >
                  <option value="">Select Vertical</option>
                  <option>Banking</option>
                  <option>Manufacturing</option>
                  <option>Technology</option>
                </select>
              </div>
              <div>
                <label for="lead-source" class="block text-sm font-medium text-gray-700 mb-1"
                  >Lead Source <span class="text-[#E60002]">*</span></label
                >
                <select
                  id="lead-source"
                  name="lead_source"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                >
                  <option value="">Select Lead Source</option>
                  <option>Website</option>
                  <option>Referral</option>
                  <option>Campaign</option>
                </select>
              </div>
            </div>

            <div class="border-t border-gray-200 pt-4">
              <h2 class="text-sm font-semibold text-gray-900 mb-3">Other Fields</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label for="company-name" class="block text-sm font-medium text-gray-700 mb-1"
                    >Company Name</label
                  >
                  <input
                    id="company-name"
                    name="company_name"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="company-sector" class="block text-sm font-medium text-gray-700 mb-1"
                    >Company Sector <span class="text-[#E60002]">*</span></label
                  >
                  <select
                    id="company-sector"
                    name="company_sector"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  >
                    <option value="">Select Sector</option>
                    <option>Banking</option>
                    <option>IT</option>
                    <option>Manufacturing</option>
                  </select>
                </div>
                <div>
                  <label for="company-website" class="block text-sm font-medium text-gray-700 mb-1"
                    >Company Website URL</label
                  >
                  <input
                    id="company-website"
                    name="company_website"
                    type="url"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="designation" class="block text-sm font-medium text-gray-700 mb-1"
                    >Designation</label
                  >
                  <input
                    id="designation"
                    name="designation"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="country" class="block text-sm font-medium text-gray-700 mb-1"
                    >Country</label
                  >
                  <input
                    id="country"
                    name="country"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="state" class="block text-sm font-medium text-gray-700 mb-1">State</label>
                  <input
                    id="state"
                    name="state"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="city" class="block text-sm font-medium text-gray-700 mb-1">City</label>
                  <input
                    id="city"
                    name="city"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="date-of-birth" class="block text-sm font-medium text-gray-700 mb-1"
                    >Date of Birth of Client</label
                  >
                  <input
                    id="date-of-birth"
                    name="date_of_birth"
                    type="date"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="whatsapp-number" class="block text-sm font-medium text-gray-700 mb-1"
                    >WhatsApp Number</label
                  >
                  <input
                    id="whatsapp-number"
                    name="whatsapp_number"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="comments" class="block text-sm font-medium text-gray-700 mb-1"
                    >Comments / Remark <span class="text-[#E60002]">*</span></label
                  >
                  <textarea
                    id="comments"
                    name="comments"
                    rows="3"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="border-t border-gray-200 pt-4">
              <h2 class="text-sm font-semibold text-gray-900 mb-3">
                To be filled only when reference is given
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label for="reference-name" class="block text-sm font-medium text-gray-700 mb-1"
                    >Name</label
                  >
                  <input
                    id="reference-name"
                    name="reference_name"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="reference-mobile" class="block text-sm font-medium text-gray-700 mb-1"
                    >R_Mobile No</label
                  >
                  <input
                    id="reference-mobile"
                    name="reference_mobile"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="reference-email" class="block text-sm font-medium text-gray-700 mb-1"
                    >R_Email ID</label
                  >
                  <input
                    id="reference-email"
                    name="reference_email"
                    type="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label
                    for="reference-designation"
                    class="block text-sm font-medium text-gray-700 mb-1"
                    >R_Designation</label
                  >
                  <input
                    id="reference-designation"
                    name="reference_designation"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="reference-location" class="block text-sm font-medium text-gray-700 mb-1"
                    >R_Location</label
                  >
                  <input
                    id="reference-location"
                    name="reference_location"
                    type="text"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
              </div>
            </div>

            <div class="border-t border-gray-200 pt-4">
              <h2 class="text-sm font-semibold text-gray-900 mb-3">Appointments</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label for="appointment-date" class="block text-sm font-medium text-gray-700 mb-1"
                    >Date</label
                  >
                  <input
                    id="appointment-date"
                    name="appointment_date"
                    type="date"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
                <div>
                  <label for="appointment-time" class="block text-sm font-medium text-gray-700 mb-1"
                    >Time</label
                  >
                  <input
                    id="appointment-time"
                    name="appointment_time"
                    type="time"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                  />
                </div>
              </div>
            </div>

            <div class="flex items-center justify-end gap-2">
              <button
                type="reset"
                class="px-3 py-2 text-sm font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-colors"
              >
                Clear
              </button>
              <button
                type="submit"
                class="px-3 py-2 text-sm font-medium rounded-lg bg-[#E60002] hover:bg-[#E60002]/90 text-white transition-colors"
              >
                Save
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="assets/js/include.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
