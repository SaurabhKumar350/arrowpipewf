    <script>
      (function () {
        function closest(el, selector) {
          while (el && el.nodeType === 1) {
            if (el.matches(selector)) return el;
            el = el.parentElement;
          }
          return null;
        }

        function setPanelPosition(root) {
          const panel = root.querySelector(".ap-ms-panel");
          if (!panel) return;
          root.style.position = "relative";
          panel.style.left = "0px";
          panel.style.right = "0px";
        }

        function renderChips(root) {
          const chipsWrap = root.querySelector(".ap-ms-chips");
          const placeholder = root.querySelector(".ap-ms-placeholder");
          const items = Array.from(root.querySelectorAll(".ap-ms-item"));
          const selected = items.filter((i) => i.checked).map((i) => i.value);

          chipsWrap.innerHTML = "";
          selected.forEach((val) => {
            const chip = document.createElement("span");
            chip.className =
              "inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gray-100 text-gray-800 text-sm";
            chip.innerHTML = `<span class="truncate max-w-[220px]">${val}</span>
              <button type="button" class="ap-chip-remove text-gray-500 hover:text-gray-800" aria-label="Remove ${val}">
                <i class="ph ph-x text-[14px]"></i>
              </button>`;
            chip.querySelector(".ap-chip-remove").addEventListener("click", (e) => {
              e.preventDefault();
              const item = items.find((i) => i.value === val);
              if (item) item.checked = false;
              syncSelectAll(root);
              renderChips(root);
            });
            chipsWrap.appendChild(chip);
          });

          const ph = root.getAttribute("data-placeholder") || "Select";
          placeholder.textContent = selected.length ? "" : ph;
        }

        function syncSelectAll(root) {
          const selectAll = root.querySelector(".ap-ms-selectall");
          if (!selectAll) return;
          const items = Array.from(root.querySelectorAll(".ap-ms-item"));
          const checkedCount = items.filter((i) => i.checked).length;
          selectAll.indeterminate = checkedCount > 0 && checkedCount < items.length;
          selectAll.checked = items.length > 0 && checkedCount === items.length;
        }

        function setOpen(root, isOpen) {
          const trigger = root.querySelector(".ap-ms-trigger");
          const panel = root.querySelector(".ap-ms-panel");
          if (!trigger || !panel) return;
          trigger.setAttribute("aria-expanded", String(isOpen));
          panel.classList.toggle("hidden", !isOpen);
        }

        function initMultiSelect(root) {
          const trigger = root.querySelector(".ap-ms-trigger");
          const panel = root.querySelector(".ap-ms-panel");
          if (!trigger || !panel) return;

          setPanelPosition(root);
          renderChips(root);
          syncSelectAll(root);

          trigger.addEventListener("click", (e) => {
            e.preventDefault();
            const isOpen = trigger.getAttribute("aria-expanded") === "true";
            setOpen(root, !isOpen);
          });

          root.addEventListener("change", (e) => {
            const t = e.target;
            if (!(t instanceof HTMLInputElement)) return;
            if (t.classList.contains("ap-ms-selectall")) {
              const items = Array.from(root.querySelectorAll(".ap-ms-item"));
              items.forEach((i) => (i.checked = t.checked));
            }
            syncSelectAll(root);
            renderChips(root);
          });
        }

        document.querySelectorAll(".ap-multiselect").forEach(initMultiSelect);

        document.addEventListener("click", (e) => {
          const openRoot = closest(e.target, ".ap-multiselect");
          document.querySelectorAll(".ap-multiselect").forEach((root) => {
            if (root !== openRoot) setOpen(root, false);
          });
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            document.querySelectorAll(".ap-multiselect").forEach((root) =>
              setOpen(root, false)
            );
          }
        });
      })();
