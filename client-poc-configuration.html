<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client POC Configuration - Arrow Pipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-[#EDF1F2] text-gray-800">
    <header
      id="header-container"
      data-include="includes/header.html"
      class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 h-16"
    ></header>

    <div class="flex h-screen pt-16">
      <aside
        id="sidebar"
        class="fixed left-0 top-16 bottom-0 w-72 bg-white border-r border-gray-200 z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 overflow-y-auto"
        data-include="includes/sidebar.html"
      ></aside>

      <div
        id="sidebar-overlay"
        class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden glass"
      ></div>

      <main
        id="main-content"
        class="flex-1 lg:ml-72 p-4 md:p-6 bg-[#F2F2F2] min-h-[calc(100vh-64px)] transition-all duration-300"
      >
        <div class="flex items-center justify-between gap-3 mb-4">
          <div class="flex items-center gap-3">
            <a
              href="settings.html"
              class="inline-flex items-center justify-center h-10 w-10 rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-colors"
              aria-label="Back to Settings"
              title="Back to Settings"
            >
              <i class="ph ph-arrow-left text-xl"></i>
            </a>
            <div>
              <h1 class="text-xl md:text-2xl font-semibold text-gray-900">Client POC Configuration</h1>
              <p class="text-sm text-gray-500">Build and save your Client POC form layout</p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-[20px] shadow-sm border border-gray-300">
          <form class="p-4 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label for="client-name" class="block text-sm font-medium text-gray-700 mb-1"
                  >Client Name <span class="text-[#E60002]">*</span></label
                >
                <input
                  id="client-name"
                  name="client_name"
                  type="text"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="poc-name" class="block text-sm font-medium text-gray-700 mb-1"
                  >POC Name <span class="text-[#E60002]">*</span></label
                >
                <input
                  id="poc-name"
                  name="poc_name"
                  type="text"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
                  >Email <span class="text-[#E60002]">*</span></label
                >
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="contact-number" class="block text-sm font-medium text-gray-700 mb-1"
                  >Contact Number <span class="text-[#E60002]">*</span></label
                >
                <input
                  id="contact-number"
                  name="contact_number"
                  type="text"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="department" class="block text-sm font-medium text-gray-700 mb-1"
                  >Department</label
                >
                <input
                  id="department"
                  name="department"
                  type="text"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="designation" class="block text-sm font-medium text-gray-700 mb-1"
                  >Designation</label
                >
                <input
                  id="designation"
                  name="designation"
                  type="text"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
              <div>
                <label for="client-birthday" class="block text-sm font-medium text-gray-700 mb-1"
                  >Client Birthday</label
                >
                <input
                  id="client-birthday"
                  name="client_birthday"
                  type="date"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#E60002] focus:ring-1 focus:ring-[#E60002]"
                />
              </div>
            </div>

            <div class="flex items-center justify-end gap-2">
              <button
                type="reset"
                class="px-3 py-2 text-sm font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-colors"
              >
                Clear
              </button>
              <button
                type="submit"
                class="px-3 py-2 text-sm font-medium rounded-lg bg-[#E60002] hover:bg-[#E60002]/90 text-white transition-colors"
              >
                Save
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="assets/js/include.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
